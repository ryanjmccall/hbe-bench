name: HBE Oracle

# Trigger the Oracle only when code is pushed to a PR
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write # Required for the bot to comment

jobs:
  verify-topology:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy torch
        # Add any other physics libs here later

    - name: 🔮 Run The Oracle (Benchmark)
      id: oracle
      run: |
        # We capture the output to post it back to the user
        # 2>&1 ensures we catch errors too
        OUTPUT=$(python benchmark.py 2>&1)
        
        # We save the output to the GitHub Environment for the next step
        echo "BENCHMARK_LOG<<EOF" >> $GITHUB_ENV
        echo "$OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # We assume benchmark.py returns exit code 0 for success, 1 for fail
        python benchmark.py

    - name: 💰 Post Result to PR
      if: always() # Run this even if the benchmark failed
      uses: actions/github-script@v6
      with:
        script: |
          const output = process.env.BENCHMARK_LOG;
          const status = '${{ job.status }}' === 'success' ? '✅ **PASSED**' : '❌ **FAILED**';
          const payoutMsg = '${{ job.status }}' === 'success' 
            ? '\n\n**System Note:** Verification successful. This solution is eligible for the Bounty Treasury.' 
            : '\n\n**System Note:** Topological constraints violated. Payout locked.';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `### 🔮 The Oracle Speaks\n\n${status}\n\n\`\`\`\n${output}\n\`\`\`${payoutMsg}`
          })
