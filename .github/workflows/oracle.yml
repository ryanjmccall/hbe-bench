name: HBE Oracle

# Trigger on both PRs (for Bounties) and Pushes (for your own sanity check)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write # Essential for the bot to comment

jobs:
  verify-topology:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy torch
        # Add 'scipy' or others here if your math gets more complex

    - name: 🔮 Run The Oracle (Benchmark)
      id: oracle
      shell: bash
      run: |
        # 1. Run the benchmark and capture output for the comment
        # We allow this to "fail" (|| true) so the script continues to the logging step
        OUTPUT=$(python benchmark.py 2>&1) || true
        
        # 2. Save output to Environment Variable (Multiline safe)
        echo "BENCHMARK_LOG<<EOF" >> $GITHUB_ENV
        echo "$OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # 3. Run it again for the official Status Check (Red X / Green Check)
        # This time, if it fails, the whole job fails.
        python benchmark.py

    - name: Verify HCB-1 Bifurcation
      run: python benchmarks/hcb_1/generator.py --verify

    - name: 💰 Post Result to PR
      # ONLY run this step if it is a Pull Request (avoids crashes on main push)
      # Run 'always()' so we get the comment even if the benchmark failed
      if: always() && github.event_name == 'pull_request' 
      uses: actions/github-script@v6
      with:
        script: |
          const output = process.env.BENCHMARK_LOG;
          // Check the conclusion of the previous step ('verification')
          const outcome = '${{ job.status }}'; 
          
          const statusHeader = outcome === 'success' ? '✅ **PASSED**' : '❌ **FAILED**';
          
          const payoutMsg = outcome === 'success' 
            ? '\n\n**System Note:** Verification successful. This solution is eligible for the Bounty Treasury.' 
            : '\n\n**System Note:** Topological constraints violated. Payout locked.';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `### 🔮 The Oracle Speaks\n\n${statusHeader}\n\n\`\`\`text\n${output}\n\`\`\`${payoutMsg}`
          })
